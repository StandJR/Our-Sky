<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#020309">
<title>Наше небо</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marck+Script&family=Nunito:wght@400;600;700&display=swap">
<style>
/* Макет: наверху название и счётчик дней, ниже поле, где звёзды медленно дрейфуют,
   внизу кнопка «+». Звезда это воспоминание, нажатие открывает карточку. */
:root {
  --sky-top: #020309;
  --sky-mid: #050812;
  --sky-low: #080d18;
  --glow: #f4f8ff;
  --gold: #e8efff;
  --cream: #f3f6ff;
  --mist: rgba(210, 220, 240, 0.62);
  --card: #090e19;
  --card-edge: rgba(190, 210, 245, 0.16);
  --font-display: "Marck Script", "Segoe Script", "Brush Script MT", cursive;
  --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html { height: 100%; background: var(--sky-top); -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  height: var(--tg-viewport-height, 100vh);
  height: var(--tg-viewport-height, 100dvh);
  background-color: var(--sky-top);
  color: var(--cream);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: max(16px, env(safe-area-inset-top, 0px));
  padding-bottom: max(16px, env(safe-area-inset-bottom, 0px));
  overflow: hidden;
}

.sky {
  position: fixed;
  inset: 0;
  z-index: 0;
  background:
    radial-gradient(ellipse at 50% 48%, rgba(22, 34, 58, 0.20), transparent 68%),
    linear-gradient(180deg, #020309 0%, #040711 58%, #070b14 100%);
}
#bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }

.app { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; }

header { text-align: center; flex: none; }
h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 400;
  font-size: clamp(40px, 12vw, 60px);
  line-height: 1.05;
  text-shadow: 0 0 26px rgba(205, 222, 255, 0.22);
}
.since { margin: 4px 0 0; color: var(--mist); font-size: 14px; letter-spacing: 0.02em; }
.count { margin: 10px 0 0; display: flex; align-items: baseline; justify-content: center; gap: 10px; }
.count b { font-weight: 700; font-size: clamp(36px, 10vw, 50px); line-height: 1; font-variant-numeric: tabular-nums; color: var(--gold); }
.count span { font-family: var(--font-display); font-size: clamp(24px, 7vw, 30px); }
.detail { margin: 2px 0 0; color: var(--mist); font-size: 13px; font-variant-numeric: tabular-nums; }

/* Поле со звёздами */
.field { position: relative; flex: 1; min-height: 0; touch-action: manipulation; }

.star {
  --star-color: #e8efff;
  --star-glow: rgba(190, 215, 255, .42);
  position: absolute;
  left: 0;
  top: 0;
  width: 48px;
  height: 48px;
  margin: -24px 0 0 -24px;
  padding: 0;
  border: 0;
  background: none;
  display: grid;
  place-items: center;
  cursor: pointer;
  color: var(--star-color);
  filter: drop-shadow(0 0 7px var(--star-glow));
  will-change: transform;
  -webkit-tap-highlight-color: transparent;
}
.star i {
  display: block;
  position: relative;
  width: 4px !important;
  height: 4px !important;
  border-radius: 50%;
  background: var(--star-color);
  box-shadow:
    0 0 2px 1px rgba(255,255,255,.95),
    0 0 8px 3px var(--star-glow),
    0 0 20px 7px rgba(170,205,255,.16);
  animation: twinkle 7s ease-in-out infinite;
  animation-delay: var(--d, 0s);
}
.star i::before {
  content: "";
  position: absolute;
  left: 50%;
  top: 50%;
  width: 1px;
  height: 34px;
  transform: translate(-50%, -50%);
  pointer-events: none;
  opacity: .22;
  background: linear-gradient(180deg, transparent, rgba(235,244,255,.48) 38%, #fff 50%, rgba(235,244,255,.48) 62%, transparent);
  filter: blur(.3px);
}
.star i::after { content: none; }
.star-date {
  position: absolute;
  top: calc(50% + 15px);
  left: 50%;
  transform: translateX(-50%);
  color: rgba(220, 230, 247, .72);
  font: 700 9px/1 var(--font-body);
  letter-spacing: .08em;
  white-space: nowrap;
  text-shadow: 0 1px 8px #020309, 0 0 5px #020309;
  pointer-events: none;
}
.star.first .star-date {
  top: calc(50% + 24px);
  color: #f3c982;
}
.star:focus-visible { outline: 2px solid var(--cream); outline-offset: -4px; border-radius: 50%; }
@media (hover: hover) { .star:hover { filter: drop-shadow(0 0 11px rgba(220,235,255,.62)) brightness(1.08); } }

.star.first {
  --star-color: #ffd58a;
  --star-glow: rgba(255, 190, 92, .68);
  width: 64px; height: 64px; margin: -32px 0 0 -32px;
  color: #ffe0a6;
  filter: drop-shadow(0 0 11px rgba(255, 190, 92, .62));
}
.star.first i {
  width: 5px !important;
  height: 5px !important;
  animation: twinkle 8s ease-in-out infinite;
  box-shadow:
    0 0 2px 1px rgba(255,255,255,.98),
    0 0 10px 4px rgba(210,230,255,.48),
    0 0 28px 9px rgba(155,190,245,.18);
}
.star.first i::before { height: 54px; opacity: .38; }

.star.born i { animation: born 1.5s ease-out both, twinkle 7s ease-in-out 1.5s infinite; animation-delay: 0s, 1.5s; }

@keyframes twinkle { 0%, 100% { transform: scale(1); opacity: 0.88; } 50% { transform: scale(0.94); opacity: 0.72; } }
@keyframes beat { 0%, 100% { transform: scale(1); } 14% { transform: scale(1.14); } 28% { transform: scale(1); } 42% { transform: scale(1.1); } 70% { transform: scale(1); } }
@keyframes born { 0% { transform: scale(0.1) rotate(-90deg); opacity: 0; } 55% { transform: scale(2.2) rotate(0); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }

@keyframes twinkle { 0%, 100% { transform: scale(1); opacity: 0.95; } 50% { transform: scale(0.76); opacity: 0.6; } }
@keyframes beat { 0%, 100% { transform: scale(1); } 14% { transform: scale(1.14); } 28% { transform: scale(1); } 42% { transform: scale(1.1); } 70% { transform: scale(1); } }
@keyframes born { 0% { transform: scale(0.1) rotate(-90deg); opacity: 0; } 55% { transform: scale(2.2) rotate(0); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }

.dock { flex: none; display: flex; flex-direction: column; align-items: center; gap: 6px; padding-top: 4px; }
.add {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  border: 1px solid rgba(205, 222, 255, .28);
  background: radial-gradient(circle at 50% 35%, rgba(205, 222, 255, .18), rgba(120, 155, 210, .05));
  color: var(--cream);
  display: grid;
  place-items: center;
  cursor: pointer;
  box-shadow: 0 0 30px rgba(150,185,245,.13), inset 0 0 18px rgba(205,222,255,.06);
}
.add svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; }
.add:focus-visible, .btn:focus-visible, .close:focus-visible { outline: 2px solid var(--cream); outline-offset: 3px; }
.dock span { font-size: 13px; color: var(--mist); }

/* Вход */
.gate {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: grid;
  place-items: center;
  padding: 24px max(16px, env(safe-area-inset-left, 0px));
  overflow: auto;
}
.gate-in { width: min(100%, 420px); text-align: center; }
.gate h2 { margin: 0 0 8px; font-family: var(--font-display); font-weight: 400; font-size: 52px; line-height: 1.05; text-shadow: 0 0 30px rgba(255, 143, 177, 0.5); }
.gate p { margin: 0 0 18px; color: var(--mist); }
.gate details { text-align: left; border-top: 1px solid var(--card-edge); padding-top: 14px; }
.gate summary { cursor: pointer; color: var(--mist); font-size: 14px; text-align: center; }

/* Карточки и формы */
dialog {
  position: fixed;
  width: min(100%, 520px);
  max-width: 100%;
  max-height: 90vh;
  max-height: 90dvh;
  margin: auto auto 0;
  padding: 26px 22px calc(26px + env(safe-area-inset-bottom, 0px));
  overflow: auto;
  border: 1px solid rgba(190, 210, 245, .2);
  border-bottom: 0;
  border-radius: 28px 28px 0 0;
  background:
    radial-gradient(ellipse at 50% 0%, rgba(116, 145, 190, .13), transparent 58%),
    linear-gradient(180deg, #0d1421 0%, #080d17 100%);
  color: var(--cream);
  box-shadow: 0 -18px 70px rgba(0, 0, 0, .38);
}
dialog[open] { animation: rise 0.35s ease-out; }
dialog::backdrop { background: rgba(6, 4, 20, 0.72); backdrop-filter: blur(3px); }
@keyframes rise { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (min-width: 700px) { dialog { margin: auto; border-radius: 22px; padding-bottom: 26px; } }
dialog form { margin: 0; }
dialog form > h2.card-title {
  margin: 4px 48px 22px 0;
  font-family: var(--font-body);
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -.025em;
}
dialog form > h2.card-title::before {
  content: "НОВОЕ ВОСПОМИНАНИЕ";
  display: block;
  margin-bottom: 8px;
  color: #b6c7e3;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .19em;
}
dialog label { margin: 17px 0 7px; color: #aebbd0; font-size: 12px; letter-spacing: .035em; }
dialog input[type="text"], dialog input[type="date"], dialog textarea {
  border-color: rgba(180, 202, 238, .16);
  border-radius: 14px;
  background: rgba(2, 6, 14, .62);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.025);
  transition: border-color .2s, background .2s, box-shadow .2s;
}
dialog input[type="text"]:focus, dialog input[type="date"]:focus, dialog textarea:focus {
  border-color: rgba(204, 220, 247, .56);
  background: rgba(5, 11, 22, .92);
  box-shadow: 0 0 0 3px rgba(170, 195, 235, .08);
  outline: none;
}
dialog textarea { min-height: 112px; }
dialog input[type="file"] { margin-top: 3px; }
dialog .row { gap: 10px; margin-top: 22px; }
dialog .row .btn { min-height: 48px; padding-inline: 20px; }
dialog .row .btn.primary {
  background: linear-gradient(135deg, #f4e4c5, #d5b77f);
  color: #17130c;
  box-shadow: 0 5px 22px rgba(210, 174, 112, .16);
}

/* Новая форма воспоминания */
.memory-form { display: grid; gap: 15px; }
.memory-form > h2.card-title { margin-bottom: 0; }
.memory-intro { margin: -8px 0 2px; color: rgba(205,218,240,.66); font-size: 13px; }
.memory-section { padding: 15px; border: 1px solid rgba(190,210,245,.12); border-radius: 18px; background: rgba(255,255,255,.025); }
.memory-section-title { display:flex; align-items:center; gap:9px; margin:0 0 12px; color:#e8eefb; font-size:13px; font-weight:700; letter-spacing:.025em; }
.memory-section-title span { display:grid; place-items:center; width:25px; height:25px; border-radius:9px; background:rgba(190,210,245,.1); color:#dce7fb; font-size:12px; }
.memory-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.memory-field { min-width:0; }
.memory-field.full { grid-column:1 / -1; }
.memory-field > label { display:block; margin:0 0 6px; color:#aebbd0; font-size:12px; }
.memory-form input[type="text"], .memory-form input[type="date"], .memory-form textarea, .memory-form select {
  width:100%; min-width:0; padding:12px 13px; border:1px solid rgba(180,202,238,.16);
  border-radius:13px; background:rgba(2,6,14,.72); color:#f3f6ff; font:inherit; font-size:15px;
  transition:border-color .22s, background .22s, box-shadow .22s;
}
.memory-form input:focus, .memory-form textarea:focus, .memory-form select:focus {
  outline:none; border-color:rgba(211,225,250,.62); background:rgba(5,11,22,.96);
  box-shadow:0 0 0 3px rgba(170,195,235,.09);
}
.memory-form textarea { min-height:112px; resize:vertical; }
.memory-hint { margin:6px 1px 0; color:rgba(190,205,229,.52); font-size:11px; line-height:1.45; }
.memory-toggle { display:flex !important; align-items:center; gap:11px; margin:0 !important; padding:12px 13px; border:1px solid rgba(190,210,245,.12); border-radius:14px; background:rgba(255,255,255,.025); }
.memory-toggle input { width:18px; height:18px; accent-color:#d6e2f7; flex:none; }
.memory-toggle-copy { display:grid; gap:2px; }
.memory-toggle-copy b { color:#e8eefb; font-size:13px; font-weight:700; }
.memory-toggle-copy small { color:rgba(190,205,229,.58); font-size:11px; }
.memory-type { display:grid; grid-template-columns:1fr 1fr; gap:9px; }
.memory-type label { display:flex; align-items:center; justify-content:center; gap:8px; min-height:43px; margin:0; padding:9px; border:1px solid rgba(190,210,245,.14); border-radius:12px; background:rgba(255,255,255,.025); color:#c7d3e7; font-size:13px; cursor:pointer; }
.memory-type input { accent-color:#d6e2f7; }
.memory-upload { display:grid; gap:10px; }
.memory-upload-pick { display:flex; align-items:center; justify-content:center; gap:10px; min-height:66px; padding:14px; border:1px dashed rgba(195,215,248,.3); border-radius:15px; background:rgba(170,195,235,.045); color:#dbe6fa; text-align:center; font-size:13px; cursor:pointer; transition:background .2s, border-color .2s, transform .2s; }
.memory-upload-pick:active { transform:scale(.99); }
.memory-upload-pick strong { display:block; font-size:13px; }
.memory-upload-pick small { display:block; margin-top:2px; color:rgba(190,205,229,.58); font-size:11px; }
.memory-file-input { position:absolute; width:1px !important; height:1px; opacity:0; overflow:hidden; clip:rect(0,0,0,0); }
.memory-preview { overflow:hidden; border:1px solid rgba(190,210,245,.14); border-radius:14px; background:#030711; }
.memory-preview:empty { display:none; }
.memory-preview img, .memory-preview video { display:block; width:100%; max-height:250px; object-fit:contain; background:#02040a; }
.memory-preview-note { padding:8px 10px; color:rgba(210,222,242,.72); font-size:11px; overflow-wrap:anywhere; }
.memory-remove { display:flex !important; align-items:center; gap:8px; margin:0 !important; color:#f0b6c0 !important; font-size:12px !important; }
.memory-remove input { accent-color:#f0a9b7; }
.memory-actions { display:grid; grid-template-columns:1fr auto; gap:10px; margin-top:2px !important; }
.memory-actions .btn { min-height:49px; }
.memory-actions .btn.primary { border:0; }
.memory-actions .btn:not(.primary) { padding-inline:17px; }
@media (max-width:420px) { .memory-grid { grid-template-columns:1fr; } .memory-field.full { grid-column:auto; } .memory-section { padding:13px; } }
@media (prefers-reduced-motion: reduce) { .memory-upload-pick { transition:none; } }

.close {
  position: absolute;
  top: 10px;
  right: 10px;
  width: 44px;
  height: 44px;
  border: 0;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.07);
  color: var(--cream);
  font-size: 26px;
  line-height: 1;
  cursor: pointer;
}

.card-date { margin: 0 52px 4px 0; color: var(--gold); font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; }
.card-title { margin: 0 52px 12px 0; font-family: var(--font-display); font-weight: 400; font-size: 36px; line-height: 1.1; text-wrap: balance; overflow-wrap: anywhere; }
.card-photo img { display: block; width: 100%; max-height: 320px; object-fit: cover; border-radius: 14px; margin: 4px 0 16px; }
.card-photo video { display:block; width:100%; max-height:320px; border-radius:14px; margin:4px 0 16px; background:#02040a; }
.delete-panel { display:grid; gap:15px; }
.delete-warning { display:flex; gap:12px; align-items:flex-start; padding:15px; border:1px solid rgba(255,145,165,.2); border-radius:16px; background:rgba(120,25,48,.12); }
.delete-symbol { display:grid; place-items:center; flex:none; width:36px; height:36px; border-radius:12px; background:rgba(255,130,155,.1); color:#ffb2c0; font-size:19px; }
.delete-warning b { display:block; margin:1px 0 4px; color:#ffe4e9; font-size:14px; }
.delete-warning p { margin:0; color:rgba(237,205,213,.72); font-size:12px; line-height:1.5; }
.delete-actions { display:grid; grid-template-columns:1fr auto; gap:10px; }
.delete-actions .btn { min-height:48px; }
.delete-actions .btn.danger { border-color:rgba(255,130,155,.24); background:rgba(145,35,58,.16); }
.verify-code { letter-spacing:.32em; text-align:center; font-size:24px !important; font-weight:700 !important; }
.delete-kicker { margin:0 0 5px; color:#ffb7c5; font-size:10px; font-weight:700; letter-spacing:.18em; text-transform:uppercase; }
.card-text { margin: 0 0 8px; white-space: pre-line; font-size: 17px; line-height: 1.65; overflow-wrap: anywhere; }
.card-author { margin: 10px 0 0; color: var(--mist); font-size: 13px; }

.comments { margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--card-edge); }
.comments h3 { margin: 0 0 12px; font-size: 15px; letter-spacing: .02em; }
.comment-list { display: grid; gap: 12px; margin-bottom: 16px; }
.comment { padding: 11px 13px; border: 1px solid var(--card-edge); border-radius: 14px; background: rgba(255,255,255,.035); }
.comment strong { display: block; margin-bottom: 3px; color: #dbe6fa; font-size: 13px; }
.comment p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; }
.comment-delete { margin-top: 9px; padding: 5px 9px; border: 1px solid rgba(255,120,140,.28); border-radius: 9px; background: rgba(255,90,115,.08); color: #ffb5c1; font: inherit; font-size: 12px; cursor: pointer; }
.comment-empty { color: var(--mist); font-size: 13px; }
.comment-form textarea { min-height: 76px; margin-top: 4px; }
.comment-form .btn { margin-top: 9px; }


label { display: block; margin: 14px 0 6px; font-size: 13px; color: var(--mist); }
label.check { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
input[type="text"], input[type="date"], input[type="email"], input[type="password"], textarea {
  width: 100%;
  min-width: 0;
  padding: 12px 14px;
  border-radius: 12px;
  border: 1px solid var(--card-edge);
  background: rgba(255, 255, 255, 0.06);
  color: var(--cream);
  font: inherit;
  font-size: 16px;
}
input[type="file"] { width: 100%; font: inherit; font-size: 14px; color: var(--mist); }
input:focus-visible, textarea:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
textarea { resize: vertical; }

.row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
.btn {
  padding: 12px 20px;
  border-radius: 999px;
  border: 1px solid var(--card-edge);
  background: rgba(255, 255, 255, 0.07);
  color: var(--cream);
  font: inherit;
  font-weight: 600;
  cursor: pointer;
}
.btn.primary { background: linear-gradient(135deg, #edf3ff, #aebfdf); color: #101827; border-color: transparent; }
.btn.danger { color: #ffa3b0; }
.btn[disabled] { opacity: 0.55; cursor: default; }
.err { margin: 10px 0 0; min-height: 1.2em; color: #ffb3bd; font-size: 14px; }

.toast {
  position: fixed;
  left: 50%;
  bottom: max(24px, env(safe-area-inset-bottom, 0px));
  z-index: 30;
  max-width: min(90vw, 420px);
  padding: 12px 18px;
  border: 1px solid var(--card-edge);
  border-radius: 16px;
  background: var(--card);
  text-align: center;
  font-size: 15px;
  opacity: 0;
  transform: translate(-50%, 20px);
  pointer-events: none;
  transition: opacity 0.3s, transform 0.3s;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="sky" aria-hidden="true"></div>
<canvas id="bg" aria-hidden="true"></canvas>

<div class="app" id="app" hidden>
  <header>
    <h1>Наше небо</h1>
    <p class="since" id="since"></p>
    <p class="count"><b id="days">0</b><span id="daysWord">дней</span></p>
    <p class="detail" id="detail"></p>
  </header>
  <div class="field" id="field" role="group" aria-label="Звёзды с нашими воспоминаниями"></div>
  <div class="dock" id="dock">
    <button class="add" id="addBtn" type="button" aria-label="Добавить звезду">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v16M4 12h16"/></svg>
    </button>
    <span>Добавить звезду</span>
  </div>
</div>

<section class="gate" id="gate" hidden>
  <div class="gate-in">
    <h2>Наше небо</h2>
    <p id="gateMsg">Наше небо хранит воспоминания. Можно войти или просто посмотреть.</p>
    <p class="err" id="gateErr" role="alert"></p>
  </div>
</section>

<dialog id="dlg" aria-labelledby="dlgTitle"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.8"></script>
<script src="config.js"></script>
<script>
(() => {
  "use strict";

  const CFG = window.CONFIG || {};
  const FIRST = CFG.FIRST_STAR || { title: "Всё началось", date: CFG.START_DATE || "2026-11-03", text: "" };
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const $ = (id) => document.getElementById(id);

  /* ---------- Мелкие помощники ---------- */
  const ymd = (d) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  const parseDay = (s) => { const [y, m, d] = String(s).split("-").map(Number); return new Date(y, m - 1, d); };
  const fmtShort = (s) => parseDay(s).toLocaleDateString("ru-RU", { day: "numeric", month: "long" });
  const fmtFull = (s) => parseDay(s).toLocaleDateString("ru-RU", { day: "numeric", month: "long", year: "numeric" });
  const plural = (n, f) => {
    const a = Math.abs(n) % 100, b = a % 10;
    if (a > 10 && a < 20) return f[2];
    if (b > 1 && b < 5) return f[1];
    if (b === 1) return f[0];
    return f[2];
  };
  const hash = (str) => {
    let x = 2166136261;
    for (let i = 0; i < str.length; i++) { x ^= str.charCodeAt(i); x = Math.imul(x, 16777619); }
    return x >>> 0;
  };
  const enc = (s) => btoa(String.fromCharCode(...new TextEncoder().encode(s))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  const dec = (s) => {
    s = s.replace(/-/g, "+").replace(/_/g, "/");
    while (s.length % 4) s += "=";
    return new TextDecoder().decode(Uint8Array.from(atob(s), (c) => c.charCodeAt(0)));
  };

  // Создание элементов без innerHTML: чужой текст всегда попадает как текст
  // Убираем артефакты старых пустых значений, которые раньше склеивались как "nullnull...".
  const cleanDisplayText = (value, fallback = "") => {
    if (typeof value !== "string") return fallback;
    const cleaned = value.replace(/(?:null){2,}/gi, "").trim();
    return cleaned || fallback;
  };

  const h = (tag, props = {}, ...kids) => {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) {
      if (k === "class") el.className = v;
      else if (k === "text") el.textContent = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else if (v === true) el.setAttribute(k, "");
      else if (v !== false && v != null) el.setAttribute(k, v);
    }
    kids.flat().forEach((c) => { if (c != null && c !== false) el.append(c); });
    return el;
  };

  let toastTimer = null;
  const toast = (msg) => {
    const el = $("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 4200);
  };

  /* ---------- Счётчик ---------- */
  const since = parseDay(CFG.START_DATE || "2026-11-03");
  $("since").textContent = "Мы вместе с " + fmtShort(CFG.START_DATE || "2026-11-03");
  const tick = () => {
    const ms = Math.max(0, Date.now() - since.getTime());
    const days = Math.floor(ms / 864e5);
    $("days").textContent = days;
    $("daysWord").textContent = plural(days, ["день", "дня", "дней"]);
    $("detail").textContent = "и " + (Math.floor(ms / 36e5) % 24) + " ч " + (Math.floor(ms / 6e4) % 60) + " мин";
  };
  tick();
  setInterval(tick, 15000);

  /* ---------- Звёздный фон ---------- */
  const cv = $("bg");
  const ctx = cv.getContext("2d");
  let dots = [], cw = 0, ch = 0;
  const initCanvas = () => {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cw = window.innerWidth; ch = window.innerHeight;
    cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.min(170, Math.round(cw * ch / 7000));
    dots = Array.from({ length: n }, () => ({
      x: Math.random() * cw, y: Math.random() * ch,
      r: Math.random() * 1.2 + 0.3, a: Math.random() * 0.5 + 0.35,
      s: Math.random() * 1.5 + 0.5, p: Math.random() * 6.28
    }));
  };
  const drawBg = (ts) => {
    ctx.clearRect(0, 0, cw, ch);
    const t = ts / 1000;
    for (const d of dots) {
      ctx.globalAlpha = reduce ? d.a : d.a * (0.65 + 0.35 * Math.sin(t * d.s + d.p));
      ctx.fillStyle = d.r > 1.1 ? "#ffe9c9" : "#ffffff";
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.r, 0, 6.283);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (!reduce) requestAnimationFrame(drawBg);
  };
  initCanvas();
  if (reduce) drawBg(0); else requestAnimationFrame(drawBg);
  let lastW = window.innerWidth;
  window.addEventListener("resize", () => {
    if (window.innerWidth === lastW) return;
    lastW = window.innerWidth;
    initCanvas();
    if (reduce) drawBg(0);
  });

  /* ---------- Дрейфующие звёзды ---------- */
  const field = $("field");
  const bodies = new Map();
  const COLORS = ["#e8efff", "#fff3e8"];
  const EDGE = 30;
  let fw = 0, fh = 0, loaded = false, lastTs = 0;

  const measure = () => {
    const r = field.getBoundingClientRect();
    fw = r.width; fh = r.height;
    for (const b of bodies.values()) {
      b.x = Math.min(Math.max(b.x, EDGE), Math.max(EDGE, fw - EDGE));
      b.y = Math.min(Math.max(b.y, EDGE), Math.max(EDGE, fh - EDGE));
      place(b);
    }
  };
  const place = (b) => { b.el.style.transform = "translate3d(" + b.x.toFixed(1) + "px," + b.y.toFixed(1) + "px,0)"; };

  const createBody = (s, born) => {
    const isFirst = s.id === "first";
    const hs = hash(s.id);
    const dateValue = typeof s.happened_on === "string" && /^\d{4}-\d{2}-\d{2}$/.test(s.happened_on)
      ? s.happened_on : (isFirst ? FIRST.date : "");
    const dateLabel = dateValue
      ? dateValue.slice(8, 10) + "." + dateValue.slice(5, 7) + "." + dateValue.slice(2, 4)
      : "";
    const el = h("button", { class: "star" + (isFirst ? " first" : "") + (born ? " born" : ""), type: "button", "aria-label": (s.title || "Воспоминание") + ", " + dateLabel },
      h("i", { "aria-hidden": "true" }),
      h("span", { class: "star-date", "aria-hidden": "true", text: dateLabel })
    );
    if (!isFirst) {
      if (s.star_type === "gold") {
        el.style.setProperty("--star-color", "#ffd58a");
        el.style.setProperty("--star-glow", "rgba(255, 190, 92, .68)");
      } else {
        el.style.setProperty("--star-color", "#e8efff");
        el.style.setProperty("--star-glow", "rgba(190, 215, 255, .48)");
      }
    }
    el.style.setProperty("--d", ((hs % 36) / 10).toFixed(1) + "s");
    const b = {
      id: s.id, el, data: s, hold: false,
      x: EDGE + Math.random() * Math.max(1, fw - 2 * EDGE),
      y: EDGE + Math.random() * Math.max(1, fh - 2 * EDGE),
      a: Math.random() * 6.283,
      v: (isFirst ? 5 : 7) + Math.random() * 9
    };
    const stop = () => { b.hold = true; };
    const go = () => { b.hold = el.matches(":hover"); };
    el.addEventListener("pointerenter", stop);
    el.addEventListener("pointerdown", stop);
    el.addEventListener("pointerup", go);
    el.addEventListener("pointercancel", go);
    el.addEventListener("pointerleave", () => { b.hold = false; });
    el.addEventListener("click", () => showView(b.data));
    field.append(el);
    bodies.set(s.id, b);
    place(b);
    return b;
  };

  const step = (ts) => {
    const dt = Math.min(0.05, (ts - lastTs) / 1000 || 0);
    lastTs = ts;
    if (!dlg.open && fw > 0) {
      for (const b of bodies.values()) {
        if (b.hold) continue;
        b.a += (Math.random() - 0.5) * 0.7 * dt;
        b.x += Math.cos(b.a) * b.v * dt;
        b.y += Math.sin(b.a) * b.v * dt;
        if (b.x < EDGE) { b.x = EDGE; b.a = Math.PI - b.a; }
        else if (b.x > fw - EDGE) { b.x = fw - EDGE; b.a = Math.PI - b.a; }
        if (b.y < EDGE) { b.y = EDGE; b.a = -b.a; }
        else if (b.y > fh - EDGE) { b.y = fh - EDGE; b.a = -b.a; }
        place(b);
      }
    }
    requestAnimationFrame(step);
  };

  const syncStars = (list) => {
    const ids = new Set(list.map((s) => s.id));
    for (const [id, b] of [...bodies]) {
      if (id !== "first" && !ids.has(id)) { b.el.remove(); bodies.delete(id); }
    }
    for (const s of list) {
      const b = bodies.get(s.id);
      if (b) {
        b.data = s;
        const isFirst = s.id === "first";
        b.el.classList.toggle("first", isFirst);
        b.el.style.setProperty("--star-color", isFirst ? "#ffd58a" : (s.star_type === "gold" ? "#ffd58a" : "#e8efff"));
        b.el.style.setProperty("--star-glow", isFirst || s.star_type === "gold" ? "rgba(255, 190, 92, .68)" : "rgba(190, 215, 255, .48)");
        const dateValue = typeof s.happened_on === "string" ? s.happened_on : "";
        const dateLabel = /^\d{4}-\d{2}-\d{2}$/.test(dateValue)
          ? dateValue.slice(8, 10) + "." + dateValue.slice(5, 7) + "." + dateValue.slice(2, 4)
          : "";
        b.el.setAttribute("aria-label", (s.title || "Воспоминание") + ", " + dateLabel);
        const marker = b.el.querySelector(".star-date");
        if (marker) marker.textContent = dateLabel;
      } else createBody(s, loaded);
    }
    loaded = true;
  };

  if (typeof ResizeObserver === "function") new ResizeObserver(measure).observe(field);

  /* ---------- Окно с карточкой ---------- */
  const dlg = $("dlg");
  let mode = "view";
  const setDlg = (m, ...nodes) => {
    mode = m;
    dlg.replaceChildren(...nodes);
    if (!dlg.open) dlg.showModal();
    dlg.scrollTop = 0;
  };
  const closeBtn = () => h("button", { class: "close", type: "button", "aria-label": "Закрыть", onclick: () => dlg.close() }, "×");
  dlg.addEventListener("click", (e) => {
    if (mode !== "view") return;
    const r = dlg.getBoundingClientRect();
    if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) dlg.close();
  });

  const ERR = {
    no_telegram: "Телеграм ещё не подключён к твоему профилю.",
    wait: "Код уже отправлен. Подожди полминуты и запроси ещё раз.",
    expired: "Код устарел. Запроси новый.",
    too_many: "Слишком много попыток. Запроси новый код.",
    telegram_failed: "Телеграм не принял сообщение. Проверь, что ты нажал(а) Start у бота.",
    not_found: "Такой звезды уже нет."
  };
  const errText = (x) => {
    if (x && x.error === "wrong_code") return "Неверный код. Осталось попыток: " + x.left + ".";
    if (x && ERR[x.error]) return ERR[x.error];
    if (x && typeof x.message === "string" && x.expected) return x.message;
    return "Не получилось. Проверь интернет и попробуй ещё раз.";
  };

  const isVideoPath = (path) => /\\.(mp4|mov|m4v|webm)$/i.test(String(path || ""));
  const attachMedia = async (box, path, alt) => {
    try {
      const { data, error } = await sb.functions.invoke("get-star-photo", { body: { path } });
      if (error || !data || !data.url) return;
      if (isVideoPath(path)) {
        const video = h("video", { controls: true, playsinline: true, preload: "metadata", "aria-label": alt });
        video.src = data.url;
        box.append(video);
      } else {
        const img = new Image();
        img.alt = alt;
        img.onload = () => box.append(img);
        img.src = data.url;
      }
    } catch (_) { /* медиа просто не покажется */ }
  };

  async function telegramCall(action, payload = {}) {
    if (!telegramInitData) throw new Error("Открой приложение через Telegram, чтобы использовать комментарии.");
    const { data, error } = await sb.functions.invoke("telegram-gateway", {
      body: { action, initData: telegramInitData, ...payload }
    });
    if (error) throw error;
    if (!data || !data.ok) throw new Error(data?.error || "Не удалось выполнить действие.");
    return data;
  }

  function commentsPanel(s) {
    const first = s.id === "first";
    const panel = h("section", { class: "comments" },
      h("h3", { text: "Комментарии" })
    );
    const list = h("div", { class: "comment-list" },
      h("p", { class: "comment-empty", text: "Загружаем комментарии…" })
    );
    const input = h("textarea", { rows: "3", maxlength: "1200", placeholder: "Оставить комментарий…" });
    const send = h("button", { class: "btn primary", type: "button" }, "Отправить");
    const error = h("p", { class: "err", role: "alert" });
    const form = h("div", { class: "comment-form" },
      h("label", {}, "Твой комментарий"), input, send, error
    );
    panel.append(list, form);
    const target = first ? { is_first: true } : { star_id: s.id, is_first: false };
    const refresh = async () => {
      try {
        const result = await telegramCall("comments-list", target);
        list.replaceChildren();
        if (!result.comments.length) {
          list.append(h("p", { class: "comment-empty", text: "Пока нет комментариев. Будь первым!" }));
          return;
        }
        for (const item of result.comments) {
          const card = h("article", { class: "comment" },
            h("strong", { text: cleanDisplayText(item.author_name, "Гость Telegram") }),
            h("p", { text: cleanDisplayText(item.body) })
          );
          if (item.can_delete) {
            const remove = h("button", { class: "comment-delete", type: "button" }, "Удалить комментарий");
            remove.addEventListener("click", async () => {
              if (!window.confirm("Удалить этот комментарий?")) return;
              remove.disabled = true;
              try {
                await telegramCall("comment-delete", { ...target, comment_id: item.id });
                await refresh();
              } catch (e) {
                error.textContent = e.message || "Не удалось удалить комментарий.";
              } finally {
                remove.disabled = false;
              }
            });
            card.append(remove);
          }
          list.append(card);
        }
      } catch (_) {
        list.replaceChildren(h("p", { class: "comment-empty", text: "Не удалось загрузить комментарии." }));
      }
    };
    send.addEventListener("click", async () => {
      const body = input.value.trim();
      if (!body) { error.textContent = "Напиши комментарий."; return; }
      send.disabled = true;
      error.textContent = "";
      try {
        await telegramCall("comment-create", { ...target, body });
        input.value = "";
        await refresh();
      } catch (e) {
        error.textContent = e.message || "Не удалось отправить комментарий.";
      } finally { send.disabled = false; }
    });
    refresh();
    return panel;
  }

  function showView(s) {
    const isFirst = s.id === "first";
    // Защита от null/пустых значений, которые могут прийти из старых записей БД.
    const title = cleanDisplayText(s.title, isFirst ? cleanDisplayText(FIRST.title, "Всё началось") : "Воспоминание");
    const date = typeof s.happened_on === "string" && /^\d{4}-\d{2}-\d{2}$/.test(s.happened_on)
      ? s.happened_on : (isFirst ? (FIRST.date || CFG.START_DATE || "2026-11-03") : "");
    const body = cleanDisplayText(s.body);
    const photo = h("div", { class: "card-photo" });
    const ownerControls = isMember && !isFirst
      ? h("div", { class: "row" },
          h("button", { class: "btn", type: "button", onclick: () => showForm(s) }, "Изменить"),
          h("button", { class: "btn danger", type: "button", onclick: () => showDelete(s) }, "Удалить"))
      : null;
    setDlg("view",
      closeBtn(),
      h("p", { class: "card-date", text: date ? fmtFull(date) : "" }),
      h("h2", { class: "card-title", id: "dlgTitle", text: title }),
      photo,
      body ? h("p", { class: "card-text", text: body }) : null,
      cleanDisplayText(s.author_name) ? h("p", { class: "card-author", text: "Автор: " + cleanDisplayText(s.author_name) }) : null,
      telegramInitData ? commentsPanel(s) : null,
      ownerControls
    );
    if (s.photo_path) attachMedia(photo, s.photo_path, title);
  }

  const compress = async (file, max = 1600) => {
    const url = URL.createObjectURL(file);
    try {
      const img = new Image();
      img.src = url;
      await img.decode();
      const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement("canvas");
      c.width = Math.round(img.naturalWidth * k);
      c.height = Math.round(img.naturalHeight * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      return await new Promise((res, rej) => c.toBlob((b) => (b ? res(b) : rej(new Error("photo"))), "image/jpeg", 0.82));
    } finally { URL.revokeObjectURL(url); }
  };

  function showForm(s) {
    const editing = !!s;
    const today = ymd(new Date());
    const iDate = h("input", { id: "f-date", type: "date", required: true, max: today, value: editing ? s.happened_on : today });
    const iTitle = h("input", { id: "f-title", type: "text", maxlength: "80", required: true, autocomplete: "off", placeholder: "Например, наш первый вечер", value: editing ? s.title : "" });
    const iBody = h("textarea", { id: "f-body", rows: "4", maxlength: "4000", placeholder: "Что тогда было? Что запомнилось?" });
    iBody.value = editing ? (s.body || "") : "";
    const iFile = h("input", { id: "f-photo", class: "memory-file-input", type: "file", accept: "image/jpeg,image/png,image/webp,video/mp4,video/quicktime,video/webm" });
    const iRm = h("input", { id: "f-rm", type: "checkbox" });
    const iPrivate = h("input", { id: "f-private", type: "checkbox" });
    iPrivate.checked = editing ? !!s.is_private : false;
    const iType = h("select", { id: "f-type" },
      h("option", { value: "silver" }, "Серебряная"),
      h("option", { value: "gold" }, "Золотая"));
    iType.value = editing ? (s.star_type || "silver") : "silver";
    const preview = h("div", { class: "memory-preview", "aria-live": "polite" });
    const fileNote = h("p", { class: "memory-hint", text: "JPG, PNG, WEBP или видео MP4. Максимум 50 МБ." });
    const pickLabel = h("label", { class: "memory-upload-pick", for: "f-photo" },
      h("span", { text: "＋" }),
      h("span", {},
        h("strong", { text: "Выбрать фото или видео" }),
        h("small", { text: "Можно прикрепить один файл к воспоминанию" })
      )
    );
    const removeCurrent = editing && s.photo_path
      ? h("label", { class: "memory-remove" }, iRm, "Удалить прикреплённый файл")
      : null;
    let previewUrl = null;
    const clearPreviewUrl = () => {
      if (previewUrl) URL.revokeObjectURL(previewUrl);
      previewUrl = null;
    };
    if (editing && s.photo_path) {
      preview.append(h("p", { class: "memory-preview-note", text: "Сейчас прикреплено:" }));
      attachMedia(preview, s.photo_path, "Текущий файл");
    }
    iFile.addEventListener("change", () => {
      clearPreviewUrl();
      preview.replaceChildren();
      if (removeCurrent) iRm.checked = false;
      const file = iFile.files && iFile.files[0];
      if (!file) {
        if (editing && s.photo_path && !iRm.checked) {
          preview.append(h("p", { class: "memory-preview-note", text: "Сейчас прикреплено:" }));
          attachMedia(preview, s.photo_path, "Текущий файл");
        }
        return;
      }
      const allowed = ["image/jpeg", "image/png", "image/webp", "video/mp4", "video/quicktime", "video/webm"];
      if (!allowed.includes(file.type)) {
        iFile.value = "";
        err.textContent = "Выбери JPG, PNG, WEBP или видео MP4, MOV, WEBM.";
        return;
      }
      if (file.size > 50 * 1024 * 1024) {
        iFile.value = "";
        err.textContent = "Файл слишком большой. Максимальный размер — 50 МБ.";
        return;
      }
      err.textContent = "";
      previewUrl = URL.createObjectURL(file);
      const media = file.type.startsWith("video/")
        ? h("video", { controls: true, playsinline: true, preload: "metadata" })
        : h("img", { alt: "Предпросмотр выбранного файла" });
      media.src = previewUrl;
      preview.append(media, h("p", { class: "memory-preview-note", text: file.name + " · " + (file.size / 1024 / 1024).toFixed(1) + " МБ" }));
    });
    if (removeCurrent) {
      iRm.addEventListener("change", () => {
        if (iRm.checked && !iFile.files.length) preview.replaceChildren();
        else if (!iFile.files.length && s.photo_path) {
          preview.replaceChildren(h("p", { class: "memory-preview-note", text: "Сейчас прикреплено:" }));
          attachMedia(preview, s.photo_path, "Текущий файл");
        }
      });
    }

    const err = h("p", { class: "err", role: "alert" });
    const save = h("button", { class: "btn primary", type: "submit" }, editing ? "Сохранить изменения" : "✦  Зажечь звезду");

    const onSubmit = async (e) => {
      e.preventDefault();
      save.disabled = true;
      err.textContent = "";
      try {
        const title = iTitle.value.trim();
        if (!title) { const x = new Error("Напиши заголовок."); x.expected = true; throw x; }
        let photo_path = editing ? s.photo_path : null;
        if (iRm.checked) photo_path = null;
        const file = iFile.files && iFile.files[0];
        if (file) {
          let blob = file;
          let extension = file.name.split(".").pop().toLowerCase();
          let contentType = file.type;
          if (file.type.startsWith("image/")) {
            blob = await compress(file);
            extension = "jpg";
            contentType = "image/jpeg";
          }
          const path = session.user.id + "/" + crypto.randomUUID() + "." + extension;
          const up = await sb.storage.from("photos").upload(path, blob, { contentType, upsert: false });
          if (up.error) throw up.error;
          photo_path = path;
        }
        const row = {
          title, body: iBody.value.trim(), happened_on: iDate.value, photo_path,
          is_private: iPrivate.checked, star_type: iType.value
        };
        if (editing) {
          const r = await sb.from("stars").update(row).eq("id", s.id);
          if (r.error) throw r.error;
        } else {
          row.author_name = people[session.user.id] || null;
          const r = await sb.from("stars").insert(row).select().single();
          if (r.error) throw r.error;
        }
        try { await loadStars(); } catch (_) { /* сохранение уже выполнено */ }
        clearPreviewUrl();
        dlg.close();
        toast(editing ? "Изменения сохранены" : "Новая звезда на небе");
      } catch (x) {
        err.textContent = errText(x);
        save.disabled = false;
      }
    };

    const form = h("form", { class: "memory-form", onsubmit: onSubmit },
      h("h2", { class: "card-title", id: "dlgTitle", text: editing ? "Изменить воспоминание" : "Новое воспоминание" }),
      h("p", { class: "memory-intro", text: editing ? "Обнови детали — всё важное останется на своём месте." : "Сохрани момент, к которому захочется однажды вернуться." }),
      h("section", { class: "memory-section" },
        h("h3", { class: "memory-section-title" }, h("span", { text: "01" }), "Детали воспоминания"),
        h("div", { class: "memory-grid" },
          h("div", { class: "memory-field" }, h("label", { for: "f-date", text: "Дата" }), iDate),
          h("div", { class: "memory-field" }, h("label", { for: "f-type", text: "Цвет звезды" }), iType),
          h("div", { class: "memory-field full" }, h("label", { for: "f-title", text: "Название" }), iTitle),
          h("div", { class: "memory-field full" }, h("label", { for: "f-body", text: "История" }), iBody,
            h("p", { class: "memory-hint", text: "Можно оставить пустым или написать до 4000 символов." }))
        )
      ),
      h("section", { class: "memory-section" },
        h("h3", { class: "memory-section-title" }, h("span", { text: "02" }), "Фото или видео"),
        h("div", { class: "memory-upload" }, iFile, pickLabel, preview, fileNote, removeCurrent)
      ),
      h("section", { class: "memory-section" },
        h("h3", { class: "memory-section-title" }, h("span", { text: "03" }), "Видимость"),
        h("label", { class: "memory-toggle", for: "f-private" },
          iPrivate,
          h("span", { class: "memory-toggle-copy" },
            h("b", { text: "Личное воспоминание" }),
            h("small", { text: "Видно только двум администраторам" })
          )
        )
      ),
      err,
      h("div", { class: "row memory-actions" },
        save,
        h("button", { class: "btn", type: "button", onclick: () => (editing ? showView(s) : dlg.close()) }, "Отмена"))
    );
    dlg.addEventListener("close", clearPreviewUrl, { once: true });
    setDlg("form", closeBtn(), form);
    if (!reduce) {
      requestAnimationFrame(() => {
        const firstInput = form.querySelector("#f-title");
        if (firstInput) firstInput.focus({ preventScroll: true });
      });
    }
  }

  const api = async (body) => {
    const { data, error } = await sb.functions.invoke("delete-star", { body });
    if (error) throw error;
    return data || { ok: false };
  };

  function showDelete(s) {
    const err = h("p", { class: "err", role: "alert" });
    const send = h("button", { class: "btn danger", type: "button" }, "Получить код");
    send.addEventListener("click", async () => {
      send.disabled = true;
      err.textContent = "";
      try {
        const r = await api({ action: "request", star_id: s.id });
        if (!r.ok) throw r;
        askCode(s);
      } catch (x) {
        err.textContent = errText(x);
        send.disabled = false;
      }
    });
    setDlg("form",
      closeBtn(),
      h("div", { class: "delete-panel" },
        h("p", { class: "delete-kicker", text: "Управление воспоминанием" }),
        h("h2", { class: "card-title", id: "dlgTitle", text: "Удалить звезду?" }),
        h("div", { class: "delete-warning" },
          h("span", { class: "delete-symbol", text: "!" }),
          h("div", {},
            h("b", { text: cleanDisplayText(s.title, "Это воспоминание") }),
            h("p", { text: "Звезда исчезнет с неба. После подтверждения восстановить её будет нельзя." })
          )
        ),
        h("p", { class: "card-text", text: "Для защиты мы отправим одноразовый код подтверждения в твой Telegram. Второй администратор также получит уведомление об удалении." }),
        err,
        h("div", { class: "delete-actions" },
          send,
          h("button", { class: "btn", type: "button", onclick: () => showView(s) }, "Отмена"))
      )
    );
  }

  function askCode(s) {
    const iCode = h("input", { id: "f-code", class: "verify-code", type: "text", inputmode: "numeric", autocomplete: "one-time-code", maxlength: "6", placeholder: "••••••" });
    const err = h("p", { class: "err", role: "alert" });
    const del = h("button", { class: "btn danger", type: "submit" }, "Удалить навсегда");
    const onSubmit = async (e) => {
      e.preventDefault();
      del.disabled = true;
      err.textContent = "";
      try {
        const r = await api({ action: "confirm", star_id: s.id, code: iCode.value });
        if (!r.ok) throw r;
        try { await loadStars(); } catch (_) { /* удаление уже подтверждено сервером */ }
        dlg.close();
        if (r.notification_sent) {
          toast(r.media_error ? "Звезда удалена. Уведомление отправлено, но медиафайл не удалось приложить." : "Звезда удалена. Второй администратор получил уведомление.");
        } else if (r.no_other_admin_chat) {
          toast("Звезда удалена, но у второго администратора не привязан Telegram.");
        } else if (r.notification_delivered_to > 0) {
          toast("Звезда удалена. Уведомление доставлено не всем администраторам.");
        } else {
          toast("Звезда удалена, но уведомление не доставлено. Проверь Telegram второго администратора.");
        }
      } catch (x) {
        err.textContent = errText(x);
        del.disabled = false;
      }
    };
    setDlg("form",
      closeBtn(),
      h("form", { onsubmit: onSubmit },
        h("p", { class: "delete-kicker", text: "Последний шаг" }),
        h("h2", { class: "card-title", id: "dlgTitle", text: "Подтверди удаление" }),
        h("p", { class: "card-text", text: "Код пришёл тебе в Telegram. Он действует 10 минут." }),
        h("label", { for: "f-code" }, "Одноразовый код"),
        iCode,
        err,
        h("div", { class: "row" }, del, h("button", { class: "btn", type: "button", onclick: () => showView(s) }, "Отмена")))
    );
    iCode.focus();
  }

  $("addBtn").addEventListener("click", () => showForm(null));

  /* ---------- База и вход ---------- */
  const configured = !!(CFG.SUPABASE_URL && CFG.SUPABASE_ANON_KEY && !/ВСТАВЬ/.test(CFG.SUPABASE_URL + CFG.SUPABASE_ANON_KEY));
  const sb = configured && window.supabase
    ? window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } })
    : null;

  let session = null, isGuest = false, isMember = false, people = {}, channel = null, reloadTimer = null, started = false;
  let telegramInitData = "";

  const showGate = (msg) => {
    $("app").hidden = true;
    $("gate").hidden = false;
    if (msg) $("gateMsg").textContent = msg;
  };

  async function loadStars() {
    const columns = session
      ? "*"
      : "id,author_name,title,body,happened_on,photo_path,created_at,star_type";
    const { data, error } = await sb.from("stars").select(columns)
      .order("happened_on", { ascending: true }).order("created_at", { ascending: true });
    if (error) { toast("Не получилось загрузить звёзды. Проверь интернет."); return; }
    syncStars(data || []);
  }

  const scheduleReload = () => {
    clearTimeout(reloadTimer);
    reloadTimer = setTimeout(loadStars, 300);
  };

  async function start() {
    $("gate").hidden = true;
    $("app").hidden = false;
    $("dock").hidden = !isMember;
    await new Promise((r) => requestAnimationFrame(r));
    measure();
    if (!bodies.has("first")) {
      createBody({ id: "first", title: FIRST.title, happened_on: FIRST.date, body: FIRST.text, author_name: null, photo_path: null }, false);
    }
    if (!started) { started = true; requestAnimationFrame(step); }
    if (isMember) {
      try {
        const r = await sb.from("people").select("user_id,name");
        people = Object.fromEntries((r.data || []).map((p) => [p.user_id, p.name]));
      } catch (_) { /* имена не критичны */ }
    } else {
      people = {};
    }
    await loadStars();
    if (!channel) {
      channel = sb.channel("stars-live")
        .on("postgres_changes", { event: "*", schema: "public", table: "stars" }, scheduleReload)
        .subscribe();
    }
  }

  const setSession = async (s) => {
    if (!s && isGuest && !session) return;
    const same = session && s && session.user.id === s.user.id;
    session = s;
    isGuest = false;
    if (same) return;
    if (!s) {
      if (channel) { sb.removeChannel(channel); channel = null; }
      isMember = false;
      showGate();
      return;
    }
    const { data: member } = await sb.from("people").select("user_id").eq("user_id", s.user.id).maybeSingle();
    isMember = !!member;
    if (!isMember) {
      await sb.auth.signOut();
      showGate("Этот аккаунт не входит в число владельцев нашего неба.");
      return;
    }
    start();
  };

  async function boot() {
    if (!configured) { showGate("Сайт ещё не подключён к базе. Открой SETUP.md и вставь ключи в config.js."); return; }
    if (!sb) { showGate("Не загрузилась библиотека для связи с базой. Проверь интернет и обнови страницу."); return; }

    // Ненавязчиво устанавливаем кнопку запуска Mini App в меню бота.
    sb.functions.invoke("telegram-gateway", { body: { action: "configure-menu" } }).catch(() => {});
    const tgApp = window.Telegram && window.Telegram.WebApp;
    if (tgApp && typeof tgApp.initData === "string" && tgApp.initData.length) {
      try {
        tgApp.ready();
        tgApp.expand();
        const applyTelegramViewport = () => {
          const height = Number(tgApp.viewportHeight || tgApp.viewportStableHeight || 0);
          if (height > 0) document.documentElement.style.setProperty("--tg-viewport-height", height + "px");
        };
        applyTelegramViewport();
        if (typeof tgApp.onEvent === "function") tgApp.onEvent("viewportChanged", applyTelegramViewport);
        // На поддерживаемых версиях Telegram скрываем верхнюю панель Mini App.
        if (typeof tgApp.requestFullscreen === "function") {
          try { await tgApp.requestFullscreen(); } catch (_) { /* fallback: expanded mode */ }
        }
        telegramInitData = tgApp.initData;
        const { data: identity, error: identityError } = await sb.functions.invoke("telegram-gateway", {
          body: { action: "bootstrap", initData: telegramInitData }
        });
        if (identityError || !identity || !identity.ok) throw new Error(identity?.error || "Не удалось проверить Telegram.");
        if (identity.role === "admin") {
          // При token_hash Supabase принимает только token_hash и type.
          const { data: authData, error: authError } = await sb.auth.verifyOtp({
            token_hash: identity.token_hash,
            type: "magiclink"
          });
          if (authError || !authData.session) throw authError || new Error("Не удалось войти как администратор.");
          await setSession(authData.session);
          if (!started) await start();
        } else {
          const { data: current } = await sb.auth.getSession();
          if (current.session) await sb.auth.signOut();
          session = null;
          isGuest = true;
          isMember = false;
          await start();
        }
        sb.auth.onAuthStateChange((_ev, nextSession) => setSession(nextSession));
        document.addEventListener("visibilitychange", () => { if (!document.hidden && (session || isGuest)) loadStars(); });
        return;
      } catch (e) {
        telegramInitData = "";
        showGate("Не удалось войти через Telegram. Закрой приложение и открой его снова. " + (e.message || ""));
        return;
      }
    }

    const m = location.hash.match(/^#in=(.+)$/);
    if (m) {
      try {
        const c = JSON.parse(dec(m[1]));
        await sb.auth.signInWithPassword({ email: c.e, password: c.p });
      } catch (_) { /* покажем обычный вход */ }
      history.replaceState(null, "", location.pathname + location.search);
    }
    // Вне Telegram приложение открывается автоматически как гость.
    // Администраторские права выдаются только после серверной проверки Telegram initData + chat_id.
    const { data } = await sb.auth.getSession();
    if (data.session) await sb.auth.signOut();
    session = null;
    isGuest = true;
    isMember = false;
    await start();
    sb.auth.onAuthStateChange((_ev, s) => setSession(s));

    document.addEventListener("visibilitychange", () => { if (!document.hidden && (session || isGuest)) loadStars(); });
  }

  boot();
})();
</script>
</body>
</html>
